name: Bug report
description: Report a reproducible software or documentation problem.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping preserve Goliath CNC machines. No robot is needed for software reports.
        Do not repeat a hardware action just to fill out this form. Never attach raw captures, serial numbers, Wi-Fi names/passwords or proprietary vendor files.
        Use SECURITY.md for security-sensitive reports.
  - type: textarea
    id: environment
    attributes:
      label: Environment and revision
      description: OS, Python version, commit or branch, and affected component.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, command, and a small synthetic or redacted input. For a documentation issue, link the section.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error message or relevant redacted output.
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware involvement
      options:
        - No hardware (offline, replay, or simulator)
        - Hardware was connected (describe only actions already performed)
        - Documentation only
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Shared evidence
      options:
        - label: I removed private identifiers from text and hexadecimal data and did not attach proprietary files.
          required: true
